name: Build and Release Artifacts

on:
  push:
    tags:
      - 'v*' # Trigger workflow whenever you push a version tag (e.g. v1.0.0)

permissions:
  contents: write

jobs:
  linux:
    name: Linux (.deb)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Core Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git libssl-dev

      - name: Build Core Runtime
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release -j $(nproc)

      - name: Package for Debian
        run: |
          cd build
          cpack -G DEB

      - name: Deploy to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: build/*.deb
          body: |
            # Nav — Embedded Development Orchestrator

            Nav is a unified embedded systems development tool focused on
            robotics, firmware, and hardware deployment workflows.

            **Downloads**
            - Linux (Debian/Ubuntu): `nav-*.deb`
            - Windows: `nav-*-win64.exe` (installer) or `nav-*-win64.zip` (portable)

            **Highlights in this release**
            - Build settings for apps: `[build.board.<name>]` and
              `[build.kconfig.<SYMBOL>]` tables, full `[variant.<name>]` images in
              their own build directory with per-variant dependency options,
              `[navhal] exclude`, `syscalls`, `deps_opt` and
              `linker_fragment_position`.
            - Link order: libc, libm and your libraries share the dependency
              group and `-lnosys` comes after it, so a library's own syscalls win.
            - Each build hands NavHAL 0.4.2 or later its own config file
              (`<build>/nav-effective.config`) instead of copying into the shared
              NavHAL checkout; dependency Kconfig needs never edit your `.config`.
            - Flashing: choose the debug probe (`--probe`, `--list-probes`,
              connect under reset); `~/.nav/boards.json` overlays the built-in
              boards, runners and tools.
            - Compiler warnings are listed after a successful build; `nav build
              -v` streams the full output.
            - Git URLs and refs that start with `-` are rejected.

            **Upgrading:** a project whose `CMakeLists.txt` came from nav 1.2
            needs `nav regen` to use the new settings; nav tells you when so.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows:
    name: Windows (installer + zip)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Self-contained: the script downloads its own MinGW-w64 (WinLibs), NSIS,
      # and Ninja, reusing the runner's preinstalled CMake and Git. Produces a
      # static nav.exe plus an NSIS installer and a portable ZIP under build/.
      - name: Build + package (MinGW, static)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .\scripts\windows\ci-build.ps1 -SourceDir "${{ github.workspace }}"

      - name: Deploy to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            build/nav-*-win64.exe
            build/nav-*-win64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
