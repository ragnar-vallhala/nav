name: Build and Release Artifacts

on:
  push:
    tags:
      - 'v*' # Trigger workflow whenever you push a version tag (e.g. v1.0.0)

permissions:
  contents: write

jobs:
  linux:
    name: Linux (.deb)
    # Build on the oldest supported Ubuntu: the binary needs the glibc it was
    # linked against (ubuntu-latest moved to 26.04 and produced a package that
    # would not start on 24.04).
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Core Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git libssl-dev

      - name: Build Core Runtime
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release -j $(nproc)

      - name: Package for Debian
        run: |
          cd build
          cpack -G DEB

      - name: Deploy to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: build/*.deb
          body: |
            # Nav — Embedded Development Orchestrator

            Nav is a unified embedded systems development tool focused on
            robotics, firmware, and hardware deployment workflows.

            **Downloads**
            - Linux (Debian/Ubuntu): `nav-*.deb`
            - Windows: `nav-*-win64.exe` (installer) or `nav-*-win64.zip` (portable)

            **Highlights in this release**
            - Fixes the Linux package: v1.3.0's `.deb` was built on Ubuntu 26.04
              and needs glibc 2.42, so it failed to start on Ubuntu 24.04. This
              one is built on Ubuntu 22.04 (glibc 2.35) and declares its libc
              dependency, so it runs on 22.04, 24.04 and later and apt refuses
              an install the binary could not run on.
            - Everything in v1.3.0: conditional `[build]` tables, variants,
              link order, per-build NavHAL config, probe selection, build
              warnings.

            **Upgrading:** a project whose `CMakeLists.txt` came from nav 1.2
            needs `nav regen` to use the 1.3 settings; nav tells you when so.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows:
    name: Windows (installer + zip)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Self-contained: the script downloads its own MinGW-w64 (WinLibs), NSIS,
      # and Ninja, reusing the runner's preinstalled CMake and Git. Produces a
      # static nav.exe plus an NSIS installer and a portable ZIP under build/.
      - name: Build + package (MinGW, static)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .\scripts\windows\ci-build.ps1 -SourceDir "${{ github.workspace }}"

      - name: Deploy to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            build/nav-*-win64.exe
            build/nav-*-win64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
