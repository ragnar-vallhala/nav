name: Build and Release Artifacts

on:
  push:
    tags:
      - 'v*' # a version tag publishes a release
  workflow_dispatch: # dry run without a tag: builds, checksums, uploads a workflow artifact, publishes nothing
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/windows/**'

permissions:
  contents: read

jobs:
  linux:
    name: Linux (.deb)
    # Build on the oldest supported Ubuntu: the binary needs the glibc it was
    # linked against (ubuntu-latest moved to 26.04 and produced a package that
    # would not start on 24.04).
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Core Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git libssl-dev

      - name: Build Core Runtime
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release -j $(nproc)

      - name: Package for Debian
        run: |
          cd build
          cpack -G DEB

      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: build/*.deb
          if-no-files-found: error

  windows:
    name: Windows (installer + zip)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Self-contained: the script downloads its own MinGW-w64 (WinLibs), NSIS,
      # and Ninja, reusing the runner's preinstalled CMake and Git. Produces a
      # static nav.exe plus an NSIS installer and a portable ZIP under build/.
      - name: Build + package (MinGW, static)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .\scripts\windows\ci-build.ps1 -SourceDir "${{ github.workspace }}"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: |
            build/nav-*-win64.exe
            build/nav-*-win64.zip
          if-no-files-found: error

  release:
    name: Checksums and publish
    needs: [linux, windows]
    runs-on: ubuntu-22.04
    permissions:
      contents: write # only used by the publish step, which runs on tags
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      # A missing asset must fail the run, not publish a partial release.
      - name: Check the asset set
        run: |
          cd dist
          ls -l
          test "$(ls nav-*.deb 2>/dev/null | wc -l)" -eq 1 || { echo "expected exactly one .deb"; exit 1; }
          test "$(ls nav-*-win64.exe 2>/dev/null | wc -l)" -eq 1 || { echo "expected exactly one win64.exe"; exit 1; }
          test "$(ls nav-*-win64.zip 2>/dev/null | wc -l)" -eq 1 || { echo "expected exactly one win64.zip"; exit 1; }
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            ver="${GITHUB_REF_NAME#v}"
            for f in nav-*; do
              case "$f" in *"-${ver}-"*) ;; *) echo "$f does not carry version ${ver}"; exit 1 ;; esac
            done
          fi

      - name: Write SHA256SUMS
        run: |
          cd dist
          sha256sum nav-* > SHA256SUMS
          cat SHA256SUMS
          sha256sum -c SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error

      # Notes come from the tag, not from this file: the commits since the
      # previous tag, under a fixed downloads header.
      - name: Publish to GitHub Releases
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This job has no checkout, so gh cannot find the repository from a
          # git remote and fails with "not a git repository" (v1.4.0 run).
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > header.md <<'EOF'
          # Nav, Embedded Development Orchestrator

          **Downloads**
          - Linux (Debian/Ubuntu 22.04+): `nav-*.deb`
          - Windows: `nav-*-win64.exe` (installer) or `nav-*-win64.zip` (portable)
          - `SHA256SUMS`: check with `sha256sum -c SHA256SUMS` (Windows: `Get-FileHash -Algorithm SHA256 <file>`)

          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "Release $TAG" \
              --notes-file header.md --generate-notes --verify-tag
          fi

      # Stub: the mirror upload to get.navrobotec.in waits for the publish
      # contract. Nothing is uploaded anywhere from this step.
      - name: Mirror to get.navrobotec.in (not enabled)
        run: echo "mirror upload not enabled; waiting for the publish contract"
