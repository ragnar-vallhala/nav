name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  core:
    name: C++ Core (CMake)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git libssl-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DNAV_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release -j $(nproc)

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Smoke check nav binary
        run: ./build/nav --version

  deb-floor:
    name: Linux .deb on the oldest Ubuntu
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git libssl-dev

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release -j $(nproc)

      - name: Package
        run: cd build && cpack -G DEB

      # The package must declare the libc it needs, and must not need more than
      # the oldest supported release ships (Ubuntu 22.04: glibc 2.35).
      - name: Check the glibc floor and the Depends line
        run: |
          dpkg-deb -I build/nav-*.deb | tee /dev/stderr | grep -E "Depends:.*libc6"
          max=$(objdump -T build/nav | grep -oE "GLIBC_[0-9.]+" | sed 's/GLIBC_//' | sort -V | tail -1)
          echo "highest GLIBC symbol: $max"
          # An empty value (objdump failed, or the binary has no GLIBC symbols)
          # must fail the job, not pass the comparison below.
          [ -n "$max" ] || { echo "could not read GLIBC symbols from build/nav"; exit 1; }
          [ "$(printf '%s\n' "$max" 2.35 | sort -V | tail -1)" = "2.35" ]

  # A freshly created app must build against the NavHAL version nav pins. This
  # clones NavHAL from GitHub and pip-installs kconfiglib, so it needs network.
  # Linux only: Windows is not covered until the Win11 runner of todo #293 exists.
  new-app-build:
    name: New app builds against pinned NavHAL
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # python3-venv/pip: nav creates a venv and pip-installs kconfiglib for
      # NavHAL's Kconfig step. gcc-arm-none-eabi: nav uses the system toolchain.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git libssl-dev \
            gcc-arm-none-eabi python3 python3-venv python3-pip

      - name: Build nav
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DNAV_BUILD_TESTS=OFF
          cmake --build build --config Release -j $(nproc)

      - name: Create and build a new app
        run: scripts/e2e-new-app.sh build/nav

      # The check must be able to fail: a NavHAL ref that does not exist has to
      # make the script exit non-zero (exit 2 means the script itself broke).
      - name: A bad NavHAL pin must fail
        run: |
          set +e
          NAV_E2E_NAVHAL_REF=no-such-ref-xyz scripts/e2e-new-app.sh build/nav
          rc=$?
          [ "$rc" -eq 1 ] || { echo "expected exit 1 for a bad pin, got $rc"; exit 1; }

  # The same check for an AVR board. Its own job on ubuntu-24.04: NavHAL marks
  # enumerators with __attribute__((deprecated)), which needs avr-gcc 6 or later,
  # and ubuntu-22.04 ships gcc-avr 5.4.0 (24.04 ships 7.3.0).
  new-app-build-avr:
    name: New AVR app builds against pinned NavHAL
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git libssl-dev \
            gcc-avr avr-libc python3 python3-venv python3-pip

      - name: Build nav
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DNAV_BUILD_TESTS=OFF
          cmake --build build --config Release -j $(nproc)

      - name: Create and build a new AVR app (atmega328p)
        run: NAV_E2E_BOARD=atmega328p scripts/e2e-new-app.sh build/nav

  # The same check on Windows: nav built the way the release builds it (static
  # MinGW nav.exe), then `nav create` + `nav build` of a new app against the
  # pinned NavHAL, run by the same script under Git Bash.
  new-app-build-windows:
    name: New app builds against pinned NavHAL (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build nav (MinGW, static)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .\scripts\windows\ci-build.ps1 -SourceDir "${{ github.workspace }}"

      - name: Install the ARM toolchain
        shell: pwsh
        run: |
          choco install gcc-arm-embedded -y --no-progress
          $bin = (Get-ChildItem 'C:\Program Files (x86)\GNU Arm Embedded Toolchain', 'C:\Program Files (x86)\GNU Tools Arm Embedded', 'C:\ProgramData\chocolatey\lib\gcc-arm-embedded' -Recurse -Filter arm-none-eabi-gcc.exe -ErrorAction SilentlyContinue | Select-Object -First 1).DirectoryName
          if (-not $bin) { throw 'arm-none-eabi-gcc.exe not found after install' }
          "$bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          Write-Host "arm-none-eabi-gcc in $bin"

      - name: What the runner has
        shell: bash
        run: |
          for t in git cmake python3 python ninja make arm-none-eabi-gcc file; do
            printf '%-18s' "$t"; command -v "$t" || echo "(not found)"
          done
          arm-none-eabi-gcc --version | head -1
          cmake --version | head -1

      - name: Create and build a new app
        shell: bash
        run: scripts/e2e-new-app.sh build/nav.exe

      - name: DIAGNOSTIC what extern/NavHAL is after nav create (temporary)
        shell: bash
        run: |
          export NAV_HOME="$RUNNER_TEMP/diag-home"; mkdir -p "$NAV_HOME"
          cd "$RUNNER_TEMP" && rm -rf diag-app
          "$GITHUB_WORKSPACE/build/nav.exe" create diag-app 2>&1 | tail -3
          cd "$GITHUB_WORKSPACE" 2>/dev/null; cd "$RUNNER_TEMP/diag-app" || exit 0
          echo "--- dir extern:"; cmd //c "dir extern" | grep -i "navhal" || true
          echo "--- nav.lock present:"; ls nav.lock 2>&1
          echo "--- a nav build with a bad ref and no lock, verbose:"
          sed -i "/^\\[navhal\\]/,/^\\[/ s|^ref = .*|ref = \"no-such-ref-xyz\"|" nav.toml; rm -f nav.lock
          grep -n "ref" nav.toml | head -3
          "$GITHUB_WORKSPACE/build/nav.exe" build 2>&1 | head -12 || true
          echo "--- nav.lock after:"; ls nav.lock 2>&1

      # The check must be able to fail here too: a NavHAL ref that does not exist
      # has to make the script exit 1 (2 means the script itself broke).
      - name: A bad NavHAL pin must fail
        shell: bash
        run: |
          set +e
          NAV_E2E_NAVHAL_REF=no-such-ref-xyz scripts/e2e-new-app.sh build/nav.exe
          rc=$?
          [ "$rc" -eq 1 ] || { echo "expected exit 1 for a bad pin, got $rc"; exit 1; }

